name: order-processing

# One command to run everything:  docker compose up --build
#   Swagger UI : http://localhost:8080/swagger
#   Health     : http://localhost:8080/health
# Only the gateway publishes a host port; orders-api and postgres stay on the private network.
# To browse the database, add the optional tools file (see docker-compose.tools.yml).

x-dotnet-env: &dotnet-env
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  orders-api:
    build:
      context: .
      dockerfile: src/Services/Orders/OrderProcessing.Orders.Api/Dockerfile
    environment:
      <<: *dotnet-env
      ConnectionStrings__OrdersDb: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:-orders_dev_password}
      OrderProcessing__MinPendingAgeSeconds: ${MIN_PENDING_AGE_SECONDS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  status-worker:
    build:
      context: .
      dockerfile: src/Services/StatusWorker/OrderProcessing.StatusWorker/Dockerfile
    environment:
      <<: *dotnet-env
      Worker__OrdersApiBaseUrl: http://orders-api:8080
      # Requirement: every 5 minutes. Override for a quicker demo, e.g. WORKER_INTERVAL_SECONDS=30
      Worker__IntervalSeconds: ${WORKER_INTERVAL_SECONDS:-300}
      Worker__RunOnStartup: ${WORKER_RUN_ON_STARTUP:-false}
    depends_on:
      orders-api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/OrderProcessing.Gateway/Dockerfile
    environment:
      <<: *dotnet-env
      ReverseProxy__Clusters__orders__Destinations__primary__Address: http://orders-api:8080/
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      orders-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
