name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on GitHub runners).
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  end-to-end:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d --wait
        env:
          WORKER_INTERVAL_SECONDS: "10"

      - name: Smoke test through the gateway
        run: ./scripts/smoke-test.sh
        env:
          WAIT_FOR_WORKER: "1"
          WORKER_TIMEOUT_SECONDS: "60"

      - name: Service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
