name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows "Run workflow" from the Actions tab

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # One run per test project so each gets its own .trx file (a shared default name is
      # timestamp-based and can collide). Integration tests start PostgreSQL with Testcontainers.
      - name: Test
        shell: bash
        run: |
          rc=0
          for project in tests/*/*.csproj; do
            name=$(basename "$project" .csproj)
            dotnet test "$project" --no-build -c Release \
              --logger "trx;LogFileName=$name.trx" \
              --collect:"XPlat Code Coverage" \
              --results-directory TestResults || rc=1
          done
          exit $rc

      # Test report on the run's Summary page: a table per project, failures with their message,
      # and every test grouped by class with outcome and duration (scripts/test-summary.py).
      - name: Test report
        if: success() || failure()
        shell: bash
        run: python3 scripts/test-summary.py TestResults/*.trx >> "$GITHUB_STEP_SUMMARY"

      # Code coverage: merge the per-project reports, exclude generated EF migrations.
      - name: Coverage report
        if: success() || failure()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
        with:
          reports: TestResults/*/coverage.cobertura.xml
          targetdir: coverage
          reporttypes: HtmlInline;MarkdownSummaryGithub
          classfilters: -OrderProcessing.Orders.Infrastructure.Persistence.Migrations.*

      - name: Add coverage to run summary
        if: success() || failure()
        shell: bash
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults/*.trx
            coverage

  end-to-end:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d --wait
        env:
          WORKER_INTERVAL_SECONDS: "10"

      - name: Smoke test through the gateway
        shell: bash
        run: ./scripts/smoke-test.sh | tee smoke-test.txt
        env:
          WAIT_FOR_WORKER: "1"
          WORKER_TIMEOUT_SECONDS: "60"

      - name: Add smoke test to run summary
        if: success() || failure()
        shell: bash
        run: |
          {
            echo "## End-to-end smoke test (docker compose, through the gateway)"
            echo '```'
            cat smoke-test.txt 2>/dev/null || echo "smoke test did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
